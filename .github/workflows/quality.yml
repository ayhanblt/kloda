name: Quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  lint-test-and-build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  linux-native-tests:
    name: Linux native source tests (synthetic identities, not custody)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: node tools/check-rust-size.mjs
      - run: cargo +1.99.0 fmt --manifest-path packages/pairing-native/Cargo.toml -- --check
      - run: cargo +1.99.0 clippy --manifest-path packages/pairing-native/Cargo.toml --locked --no-default-features --all-targets --features desktop-node -- -D warnings
      # Loopback/software test fixtures exercise protocol logic, never production identity custody.
      - run: cargo +1.99.0 test --manifest-path packages/pairing-native/Cargo.toml --locked --no-default-features

  desktop-source-build:
    name: ${{ matrix.name }} source build (no hardware readiness)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows MSVC
            os: windows-2025
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: rustup toolchain install 1.99.0 --profile minimal
      # Compile test sources only: no synthetic Windows runtime/hardware pass or Apple signing gate.
      - run: cargo +1.99.0 test --manifest-path packages/pairing-native/Cargo.toml --locked --no-default-features --no-run
      # Uses the actual desktop drivers, bundled SQLite, Electron ABI and host Rust target.
      - run: npm run build --workspace @kloda/desktop
