[package]
name = "kloda_storage_native"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
android-jni = ["dep:jni"]

[dependencies]
smb2 = { version = "=0.36.2", default-features = false, features = ["tokio"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "io-util", "time", "sync"] }
async-trait = "=0.1.92"
sha2 = "=0.11.1"
jni = { version = "=0.21.1", optional = true, default-features = false }

serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[build-dependencies]
sha2 = "=0.11.1"

[patch.crates-io]
smb2 = { path = "vendor/smb2" }
