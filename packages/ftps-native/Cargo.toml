[package]
name = "kloda_ftps_native"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
[lib]
crate-type = ["rlib", "staticlib", "cdylib"]
[features]
owned-fixture = []
android-jni = ["dep:jni"]
[dependencies]
jni = { version = "=0.21.1", optional = true, default-features = false }
suppaftp = { version = "=12.2.1", default-features = false, features = ["rustls-ring"] }
webpki-roots = "=1.0.11"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.11.1"
[profile.dev]
debug = 0
incremental = false
