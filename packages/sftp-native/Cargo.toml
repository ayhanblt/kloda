[package]
name = "kloda_sftp_native"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
android-jni = ["dep:jni"]

[dependencies]
russh = { version = "=0.65.0", default-features = false, features = ["ring"] }
russh-sftp = "=3.0.1"
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "time", "io-util", "sync"] }
sha2 = "=0.11.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
jni = { version = "=0.21.1", optional = true, default-features = false }

[profile.dev]
debug = 0
incremental = false
