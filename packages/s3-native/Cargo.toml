[package]
name = "kloda_s3_native"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
[lib]
crate-type = ["rlib", "staticlib", "cdylib"]
[features]
android-jni = ["dep:jni"]
[dependencies]
jni = { version = "=0.21.1", optional = true, default-features = false }
rusty-s3 = { version = "=0.10.2", default-features = false, features = ["rustcrypto", "xml"] }
url = "=2.5.8"
quick-xml = { version = "=0.41.0", features = ["serialize"] }
zeroize = "=1.9.1"
serde_json = "=1.0.145"
serde = { version = "=1.0.229", features = ["derive"] }
[profile.dev]
debug = 0
incremental = false
