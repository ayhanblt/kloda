plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.kloda.sync'
version = '0.1.0'

dependencies {
  implementation('com.facebook.react:react-android')
}

android {
  namespace "com.kloda.sync"
  ndkVersion "27.1.12297006"
  buildFeatures { buildConfig true }
  defaultConfig {
    buildConfigField "boolean", "KLODA_SMB_NATIVE", (providers.gradleProperty("klodaSmbNative").orNull == "true").toString()
    buildConfigField "boolean", "KLODA_SFTP_NATIVE", (providers.gradleProperty("klodaSftpNative").orNull == "true").toString()
    minSdkVersion 24
    consumerProguardFiles "consumer-rules.pro"
    testInstrumentationRunner "com.kloda.sync.AndroidFilesQueueRecoveryInstrumentation"
    ndk {
      abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
    }
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError true
  }
}

def pairingRepo = file("../../../../..")
def pairingCrate = new File(pairingRepo, "packages/pairing-native")
def pairingAbis = ['arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86']
def pairingNdk = providers.provider { android.ndkDirectory.absolutePath }

def buildPairingNative = tasks.register('buildPairingNative', Exec) {
  workingDir pairingRepo
  inputs.files(fileTree(pairingCrate) {
    include 'src/**', 'Cargo.toml', 'Cargo.lock', 'build.rs', '.cargo/**'
  }).withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.files(
    new File(pairingRepo, 'tools/build-native-android.mjs'),
    new File(pairingRepo, 'tools/native-build-common.mjs')
  ).withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.property('rustToolchain', '1.99.0')
  inputs.property('ndkVersion', '27.1.12297006')
  inputs.property('ndkDirectory', pairingNdk)
  inputs.property('apiLevel', 24)
  inputs.property('abis', pairingAbis)
  inputs.property('hostPlatform', System.getProperty('os.name'))
  inputs.property('hostArchitecture', System.getProperty('os.arch'))
  outputs.files(pairingAbis.collect {
    file("src/main/jniLibs/${it}/libkloda_pairing_native.so")
  })
  doFirst {
    commandLine(
      System.getenv('NODE_BINARY') ?: 'node',
      new File(pairingRepo, 'tools/build-native-android.mjs').absolutePath,
      pairingNdk.get()
    )
  }
}

tasks.matching { it.name == 'preBuild' }.configureEach {
  dependsOn buildPairingNative
}

if (providers.gradleProperty("klodaSmbNative").orNull == "true") {
  def storageCrate = new File(pairingRepo, "packages/storage-native")
  def buildStorageNative = tasks.register('buildStorageNative', Exec) {
    workingDir pairingRepo
    inputs.files(fileTree(storageCrate) { include 'src/**', 'vendor/**', 'Cargo.toml', 'Cargo.lock', 'build.rs' }).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(new File(pairingRepo, 'tools/build-storage-native.mjs'), new File(pairingRepo, 'tools/check-storage-native.mjs')).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.property('rustToolchain', '1.99.0'); inputs.property('ndkVersion', '27.1.12297006')
    outputs.files(pairingAbis.collect { file("src/main/jniLibs/${it}/libkloda_storage_native.so") })
    commandLine(System.getenv('NODE_BINARY') ?: 'node', new File(pairingRepo, 'tools/build-storage-native.mjs').absolutePath, 'android')
  }
  tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn buildStorageNative }
}

if (providers.gradleProperty("klodaSftpNative").orNull == "true") {
  def sftpCrate = new File(pairingRepo, "packages/sftp-native")
  def buildSftpNative = tasks.register('buildSftpNative', Exec) {
    workingDir pairingRepo
    inputs.files(fileTree(sftpCrate) { include 'src/**', 'vendor/**', 'Cargo.toml', 'Cargo.lock', 'build.rs' }).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(new File(pairingRepo, 'tools/build-sftp-native.mjs'), new File(pairingRepo, 'tools/check-sftp-native.mjs')).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.property('rustToolchain', '1.99.0'); inputs.property('ndkVersion', '27.1.12297006')
    outputs.files(pairingAbis.collect { file("src/main/jniLibs/${it}/libkloda_sftp_native.so") })
    commandLine(System.getenv('NODE_BINARY') ?: 'node', new File(pairingRepo, 'tools/build-sftp-native.mjs').absolutePath, 'android')
  }
  tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn buildSftpNative }
}
