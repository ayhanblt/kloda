[global]
server role = standalone server
workgroup = KLODA
netbios name = KLODAOWNED
server min protocol = SMB2_02
server max protocol = SMB2_10
server signing = mandatory
server smb encrypt = off
map to guest = Never
disable netbios = yes
smb ports = 445
load printers = no
printing = bsd
printcap name = /dev/null
log level = 1
[owned]
path = /srv/owned
valid users = owned
read only = no
guest ok = no
